[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cynbit-sentinel-ai"
version = "1.0.0"
description = "Autonomous Aspect-Based Sentiment, Crisis Early-Warning, and Reputation Intelligence Engine for Cynbit Technologies"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Rituraj Tiwari", email = "riturajtiwari@example.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "streamlit>=1.35.0",
    "pydantic>=2.9.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
